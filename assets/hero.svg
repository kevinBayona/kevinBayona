<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Kevin Bayona. Full Stack Developer. Software para quienes construyen.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Display&quot;,&quot;Segoe UI&quot;,Inter,Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.b{animation:drift 14s ease-in-out infinite alternate}
.b2{animation-duration:18s;animation-direction:alternate-reverse}
@keyframes drift{from{transform:translate(0,0)}to{transform:translate(-60px,30px)}}
.in{opacity:0;animation:in 1.2s cubic-bezier(.2,.7,.2,1) .2s forwards}
@keyframes in{to{opacity:1}}
</style>
<defs>
<clipPath id="c"><rect width="1200" height="500" rx="36"/></clipPath>
<radialGradient id="o"><stop offset="0" stop-color="#FF9F0A" stop-opacity=".9"/><stop offset="1" stop-color="#FF9F0A" stop-opacity="0"/></radialGradient>
<radialGradient id="p"><stop offset="0" stop-color="#FF375F" stop-opacity=".85"/><stop offset="1" stop-color="#FF375F" stop-opacity="0"/></radialGradient>
<radialGradient id="v"><stop offset="0" stop-color="#BF5AF2" stop-opacity=".85"/><stop offset="1" stop-color="#BF5AF2" stop-opacity="0"/></radialGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2=".4"><stop offset="0" stop-color="#FFD60A"/><stop offset=".45" stop-color="#FF375F"/><stop offset="1" stop-color="#BF5AF2"/></linearGradient>
</defs>
<g clip-path="url(#c)">
<rect width="1200" height="500" fill="#000"/>
<g class="b"><circle cx="1010" cy="120" r="330" fill="url(#o)"/><circle cx="760" cy="470" r="300" fill="url(#v)"/></g>
<g class="b b2"><circle cx="1130" cy="420" r="320" fill="url(#p)"/></g>
<rect width="1200" height="500" fill="#000" opacity=".18"/>
</g>
<g class="in">
<text x="78" y="140" font-size="26" font-weight="600" fill="#A1A1A6">Full Stack Developer</text>
<text x="70" y="262" font-size="128" font-weight="800" letter-spacing="-5" fill="#F5F5F7">Kevin</text>
<text x="70" y="384" font-size="128" font-weight="800" letter-spacing="-5" fill="url(#t)">Bayona.</text>
<text x="78" y="444" font-size="28" font-weight="500" fill="#F5F5F7">Software para quienes construyen.</text>
</g>
</svg>