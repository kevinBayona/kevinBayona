<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-label="Proyectos y datos de Kevin: UpBuild CRM, INCCAMPUS, aprendiendo DevSecOps, desde Tunja, certificaciones en Laravel y Astro.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;SF Pro Display&quot;,&quot;Segoe UI&quot;,Inter,Helvetica,Arial,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleY(1)}}
.ring{stroke-dashoffset:var(--c);animation:fill 1.6s cubic-bezier(.3,.8,.2,1) forwards}
@keyframes fill{to{stroke-dashoffset:var(--o)}}
.pulse{animation:p 2.4s ease-in-out infinite}
@keyframes p{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.bar{transform:none}.ring{stroke-dashoffset:var(--o)}}
</style>
<defs>
